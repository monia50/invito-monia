<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monia — 50 anni</title>
<meta property="og:title" content="Monia's 50th Birthday Party" />
<meta property="og:description" content="1 Giugno 2026" />
<meta property="og:image" content="https://monia50.github.io/invito-monia/header.png" />
<meta property="og:url" content="https://monia50.github.io/invito-monia" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1814;
    --ink-soft: #4a4640;
    --ink-muted: #8a8680;
    --ink-faint: #c8c4be;
    --cream: #f7f4ef;
    --cream-dark: #ede9e2;
    --gold: #b8965a;
    --gold-light: #d4b47c;
    --white: #ffffff;
  }

  html { font-size: 16px; }

  body {
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    color: var(--ink);
  }

  .page {
    width: 100%;
    max-width: 500px;
    animation: fadeUp 0.9s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--white);
    border: 1px solid var(--cream-dark);
    box-shadow: 0 2px 40px rgba(26,24,20,0.08);
    overflow: hidden;
  }

  /* HEADER */
  .header {
    background: var(--cream);
    padding: 0;
    overflow: hidden;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

.header::after {
    content: '';
    position: absolute;
    bottom: -80px; right: -40px;
    width: 240px; height: 240px;
    border-radius: 50%;
    border: 1px solid rgba(184,150,90,0.08);
  }

  .header-eyebrow {
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.5rem;
  }

  .header-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 72px;
    font-weight: 300;
    color: var(--cream);
    line-height: 1;
    margin-bottom: 0.5rem;
    position: relative;
    z-index: 1;
  }

  .header-age {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
    font-weight: 300;
    font-style: italic;
    color: var(--ink-muted);
    letter-spacing: 1px;
    margin-bottom: 2rem;
  }

  .gold-rule {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 0 auto 1.75rem;
  }
  .gold-rule::before,
  .gold-rule::after {
    content: '';
    display: block;
    width: 40px;
    height: 0.5px;
    background: var(--gold);
    opacity: 0.6;
  }
  .gold-rule .diamond {
    width: 5px;
    height: 5px;
    background: var(--gold);
    transform: rotate(45deg);
    opacity: 0.8;
  }

  .header-tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 19px;
    font-style: italic;
    font-weight: 300;
    color: var(--cream-dark);
    line-height: 1.65;
    position: relative;
    z-index: 1;
  }

  /* BODY */
  .body {
    padding: 0 2.5rem;
  }

  .detail-block {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--cream-dark);
  }
  .detail-block:last-of-type {
    border-bottom: none;
  }

  .detail-icon {
    width: 36px;
    height: 36px;
    border: 1px solid var(--cream-dark);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .detail-icon svg {
    width: 14px;
    height: 14px;
    stroke: var(--gold);
    fill: none;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .detail-label {
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 5px;
  }
  .detail-value {
    font-size: 15px;
    font-weight: 300;
    color: var(--ink);
    line-height: 1.5;
  }
  .detail-value a {
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid rgba(184,150,90,0.3);
    padding-bottom: 1px;
    transition: border-color 0.2s;
  }
  .detail-value a:hover {
    border-color: var(--gold);
  }

  /* RSVP */
  .rsvp-wrap {
    padding: 2rem 2.5rem;
    background: var(--cream);
    border-top: 1px solid var(--cream-dark);
  }

  .rsvp-title {
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--ink-muted);
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .rsvp-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .rsvp-form input {
    width: 100%;
    padding: 11px 14px;
    background: var(--white);
    border: 1px solid var(--cream-dark);
    border-radius: 0;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .rsvp-form input::placeholder { color: var(--ink-faint); }
  .rsvp-form input:focus { border-color: var(--gold); }

  .rsvp-btns {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .btn-yes {
    flex: 1;
    padding: 12px;
    background: var(--ink);
    color: var(--cream);
    border: none;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-yes:hover { background: var(--ink-soft); }

  .btn-no {
    flex: 1;
    padding: 12px;
    background: transparent;
    color: var(--ink-muted);
    border: 1px solid var(--ink-faint);
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-no:hover { border-color: var(--ink-muted); color: var(--ink-soft); }

  .rsvp-success {
    display: none;
    text-align: center;
    padding: 1rem 0;
  }
  .rsvp-success .success-icon {
    width: 40px;
    height: 40px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
  }
  .rsvp-success .success-icon svg {
    width: 16px; height: 16px;
    stroke: var(--gold);
    fill: none;
    stroke-width: 1.5;
  }
  .rsvp-success p {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 18px;
    font-style: italic;
    font-weight: 300;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  .rsvp-counter {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* FOOTER */
  .footer {
    padding: 1.5rem 2.5rem 2rem;
    text-align: center;
    border-top: 1px solid var(--cream-dark);
    background: var(--white);
  }
  .footer-signature {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 20px;
    font-style: italic;
    font-weight: 300;
    color: var(--ink-soft);
  }

  .header-text {
    padding: 2rem 2rem 0.5rem;
    text-align: left;
  }
  .header-text p {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 18px;
    font-style: italic;
    font-weight: 300;
    color: var(--cream-dark);
    line-height: 1.7;
    margin-bottom: 1rem;
  }
  .header-text p strong {
    font-style: italic;
    font-weight: 500;
    color: var(--cream);
  }
  .header-firma {
    font-size: 16px !important;
    color: var(--ink-muted) !important;
    margin-top: 0.5rem !important;
  }

  @media (max-width: 480px) {
    .header { padding: 2.5rem 1.75rem 2rem; }
    .header-name { font-size: 58px; }
    .body { padding: 0 1.75rem; }
    .rsvp-wrap { padding: 1.75rem; }
    .footer { padding: 1.25rem 1.75rem 1.75rem; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="card">

    <div class="header">
      <img src="https://monia50.github.io/invito-monia/header.png" alt="Festa 50 anni Monia" style="width:100%; display:block; margin:0; padding:0; border:none;" />
</div>

    <div class="body">

      <div class="detail-block">
        <div class="detail-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="1"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
        </div>
        <div>
          <div class="detail-label">quando</div>
          <div class="detail-value"><a href="https://www.google.com/calendar/render?action=TEMPLATE&text=Festa+50+anni+Monia&dates=20260601T193000Z/20260601T230000Z&details=Festa+di+compleanno+per+i+50+anni+di+Monia&location=Via+Monteforte+12,+Castel+San+Giorgio" target="_blank">Lunedì 1 giugno 2026 — ore 21:00</a></div>
        </div>
      </div>

      <div class="detail-block">
        <div class="detail-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.686 2 6 4.686 6 8c0 4.418 6 12 6 12s6-7.582 6-12c0-3.314-2.686-6-6-6z"/><circle cx="12" cy="8" r="2"/></svg>
        </div>
        <div>
          <div class="detail-label">dove</div>
          <div class="detail-value"><a href="https://share.google/wegzIrmPuH1Opgc4Q" target="_blank">Via Monteforte 12 — Castel San Giorgio</a></div>
        </div>
      </div>

    </div>

    <div class="rsvp-wrap">
      <div class="rsvp-title">RSVP — Conferma la tua presenza</div>
      <div class="rsvp-form" id="rsvp-form">
        <input type="text" id="rsvp-name" placeholder="Il tuo nome" autocomplete="name" />
        <input type="number" id="rsvp-guests" placeholder="Numero di persone (solo adulti)" min="1" max="20" />
        <div class="rsvp-btns">
          <button class="btn-yes" onclick="submitRsvp(true)">Ci sarò</button>
          <button class="btn-no" onclick="submitRsvp(false)">Non riesco</button>
        </div>
      </div>
      <div class="rsvp-success" id="rsvp-success" style="display:none;">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.5;"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p id="success-text"></p>
      </div>
    </div>

    <div class="footer">
      <div class="footer-quote" style="font-family:'Cormorant Garamond',Georgia,serif; font-size:19px; font-style:italic; font-weight:300; color:var(--ink-soft); line-height:1.6;">
        &laquo;L&rsquo;importante non &egrave; aggiungere anni alla vita, ma vita agli anni&raquo;
        <div style="font-size:13px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-muted); margin-top:8px; font-style:normal;">Rita Levi-Montalcini</div>
      </div>
    </div>

  </div>
</div>




<script>
  function submitRsvp(attending) {
    var nameEl = document.getElementById('rsvp-name');
    var guestsEl = document.getElementById('rsvp-guests');
    var name = nameEl.value.trim();
    var guests = Math.max(1, parseInt(guestsEl.value) || 1);

    if (!name) {
      nameEl.focus();
      nameEl.style.borderColor = '#b8965a';
      return;
    }

    var stato = attending ? 'Ci sarò' : 'Non riesco';
    var soggetto = encodeURIComponent('RSVP Festa Monia 50 - ' + stato);
    var corpo = encodeURIComponent('Nome: ' + name + '\nPersone: ' + guests + '\nPresenza: ' + stato);
    var mailtoLink = 'mailto:coppola.monia@gmail.com,forte.bb@gmail.com?subject=' + soggetto + '&body=' + corpo;

    window.location.href = mailtoLink;

    document.getElementById('rsvp-form').style.display = 'none';
    var s = document.getElementById('rsvp-success');
    s.style.display = 'block';
    var msg = attending
      ? 'Grazie ' + name + '! Non vediamo l’ora di festeggiare insieme.'
      : 'Grazie ' + name + ', ci mancherai!';
    document.getElementById('success-text').textContent = msg;
  }
</script>
</body>
</html>
